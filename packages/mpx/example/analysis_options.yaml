# The repo's strict modes and lint set; an app documents no public API.
include: ../../../analysis_options.yaml

linter:
  rules:
    public_member_api_docs: false

analyzer:
  errors:
    # `control`'s ControllerScope and `l`'s capture are marked experimental by
    # their authors, and are the packages' documented way in; the social feed
    # uses both as the rest of the author's apps do.
    experimental_member_use: ignore
