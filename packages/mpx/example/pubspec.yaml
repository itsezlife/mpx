name: mpx_example
description: Shows an mpx stack drawing media, the fullscreen viewer with save and share, and a feed list.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.38.0'

# The example shows the whole set, so it takes the decoders, the player and
# the UI that `mpx` itself never depends on. Save and share are the host's:
# file_selector (save panel) and share_plus (share sheet) live here only.
dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  http_bytes_cache:
    path: ../../http_bytes_cache
  mpx:
    path: ..
  # The media picker page: the camera session and the capture surface.
  mpx_capture:
    path: ../../mpx_capture
  mpx_core:
    path: ../../mpx_core
  # The device library: its plugin's native side, and the fake library the
  # grid benchmark scrolls.
  mpx_library:
    path: ../../mpx_library
  mpx_lottie:
    path: ../../mpx_lottie
  mpx_player:
    path: ../../mpx_player
  mpx_ui:
    path: ../../mpx_ui
  mpx_video_decoder:
    path: ../../mpx_video_decoder
  # 12, not 13: share_plus 13 needs win32 6, and mpx_library's drag and drop
  # (super_drag_and_drop 0.9) needs device_info_plus < 12, which pins win32 5.
  share_plus: ^12.0.2

dev_dependencies:
  # The device run of the viewer's gestures (integration_test/) and the
  # driver that saves its screenshots (test_driver/).
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  # Frame-timing benchmarks on a device (integration_test/).
  integration_test:
    sdk: flutter
  # Writes the clipboard in the clipboard reader's contract run.
  super_clipboard: ^0.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/media/
