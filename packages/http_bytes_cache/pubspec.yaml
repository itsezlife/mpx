name: http_bytes_cache
description: >-
  A durable cache for HTTP response bytes, with an HTTP client, middlewares and
  a disk store, in pure Dart.
version: 0.1.0
homepage: https://github.com/itsezlife/mpx
repository: https://github.com/itsezlife/mpx/tree/main/packages/http_bytes_cache
issue_tracker: https://github.com/itsezlife/mpx/issues
publish_to: none
resolution: workspace

topics:
  - cache
  - http
  - bytes
  - offline

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.11.0

dependencies:
  cancel_token: ^0.1.1
  crypto: ^3.0.6
  http: ^1.6.0
  http_parser: ^4.1.2
  meta: any
  path: ^1.9.1
  pool: ^1.5.3
  web: ^1.1.1

dev_dependencies:
  test: ^1.25.0
