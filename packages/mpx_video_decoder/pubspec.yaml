name: mpx_video_decoder
description: >
  A software video decoder for mpx_core that plays silent clips through an
  FFmpeg and libvpx library delivered by a build hook.
version: 0.0.1
homepage: https://github.com/itsezlife/mpx
repository: https://github.com/itsezlife/mpx/tree/main/packages/mpx_video_decoder
issue_tracker: https://github.com/itsezlife/mpx/issues
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.38.0'

dependencies:
  # hook/build.dart needs code_assets and hooks; the same span as mpx_lottie.
  code_assets: ">=1.1.0 <3.0.0"
  # The hook checks the SHA-256 of a downloaded prebuilt and of the sources
  # the prebuilts were built from.
  crypto: ^3.0.6
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  # Only lib/testing.dart needs it: its contract suites are written with the
  # test framework, and a library cannot import a dev dependency. Production
  # entry points never import it.
  flutter_test:
    sdk: flutter
  hooks: ^2.0.0
  meta: ^1.17.0
  # Edges fixed by ADR 0001: the core only.
  mpx_core:
    path: ../mpx_core
  # The browser element port (lib/src/web), compiled only for the web.
  web: ^1.1.1
